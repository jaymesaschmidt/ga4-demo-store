<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Tag Manager manual deploy  -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WWGBJPDB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<!-- Google Tag Manager end  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailhead Supply | Contact</title>

  <!-- STEP 6: Paste the GTM <script> snippet here, as high in <head> as possible. -->

  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #222; background: #fafafa; }
    header { background: #2f4f3a; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    header a { color: #fff; text-decoration: none; margin-left: 16px; }
    header a:first-child { margin-left: 0; }
    main { max-width: 600px; margin: 0 auto; padding: 24px; }
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 32px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin-top: 4px; border: 1px solid #bbb; border-radius: 4px; }
    .btn { display: inline-block; background: #e07b39; color: #fff; padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 16px; }
    #thank-you, #checkout-done { display: none; }
    footer { text-align: center; padding: 24px; color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <!-- STEP 6: Paste the GTM <noscript> snippet here, right after the opening <body> tag. -->

  <header>
    <strong>Trailhead Supply</strong>
    <nav>
      <a href="index.html" id="nav-home">Home</a>
      <a href="product.html" id="nav-product">Shop</a>
      <a href="thanks.html" id="nav-contact">Contact</a>
      <span id="cart-count">Cart: 0</span>
    </nav>
  </header>

  <main>
    <section class="panel" id="checkout-done">
      <h1>Order placed</h1>
      <p>Thanks for your order. Order ID: <strong id="order-id"></strong></p>
      <p><a href="index.html">Back to home</a></p>
    </section>

    <section class="panel" id="contact-section">
      <h1>Contact us</h1>
      <form id="contact-form" action="thanks.html" method="get">
        <input type="hidden" name="sent" value="1">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email_input" required>
        <label for="topic">Topic</label>
        <input type="text" id="topic" name="topic" placeholder="Order question, returns, other">
        <label for="message">Message</label>
        <textarea id="message" name="message_text" rows="4"></textarea>
        <button class="btn" type="submit" id="contact-submit">Send</button>
      </form>
    </section>

    <section class="panel" id="thank-you">
      <h1>Thanks, we got your message</h1>
      <p>We'll reply within one business day.</p>
      <p><a href="index.html">Back to home</a></p>
    </section>
  </main>

  <footer>Trailhead Supply is a fictional store for analytics practice.</footer>

  <script>
    var params = new URLSearchParams(window.location.search);
    var count = parseInt(localStorage.getItem('cartCount') || '0', 10);

    if (params.get('checkout') === '1' && count > 0) {
      var orderId = 'T' + Date.now();
      document.getElementById('order-id').textContent = orderId;
      document.getElementById('checkout-done').style.display = 'block';
      document.getElementById('contact-section').style.display = 'none';
      localStorage.setItem('cartCount', '0');
      count = 0;
      // WEEK 4: add a dataLayer.push for purchase here, with transaction_id = orderId.
    }

    if (params.get('sent') === '1') {
      document.getElementById('contact-section').style.display = 'none';
      document.getElementById('thank-you').style.display = 'block';
      // Strip form fields from the URL so names and emails never reach GA4 in page_location.
      history.replaceState(null, '', 'thanks.html?sent=1');
    }

    document.getElementById('cart-count').textContent = 'Cart: ' + count;
  </script>
</body>
</html>
