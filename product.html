<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailhead Supply | Trail Pack 30L</title>

  <!-- STEP 6: Paste the GTM <script> snippet here, as high in <head> as possible. -->

  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #222; background: #fafafa; }
    header { background: #2f4f3a; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    header a { color: #fff; text-decoration: none; margin-left: 16px; }
    header a:first-child { margin-left: 0; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    .product { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
    .image { background: #cfd8cf; border-radius: 8px; min-height: 240px; display: flex; align-items: center; justify-content: center; color: #2f4f3a; font-weight: bold; }
    .price { font-size: 24px; color: #2f4f3a; font-weight: bold; }
    .btn { display: inline-block; background: #e07b39; color: #fff; padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; text-decoration: none; }
    .btn-secondary { background: #2f4f3a; margin-left: 8px; }
    select { padding: 8px; font-size: 16px; margin-bottom: 16px; }
    #cart-message { color: #2f4f3a; font-weight: bold; min-height: 24px; }
    footer { text-align: center; padding: 24px; color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <!-- STEP 6: Paste the GTM <noscript> snippet here, right after the opening <body> tag. -->

  <header>
    <strong>Trailhead Supply</strong>
    <nav>
      <a href="index.html" id="nav-home">Home</a>
      <a href="product.html" id="nav-product">Shop</a>
      <a href="thanks.html" id="nav-contact">Contact</a>
      <span id="cart-count">Cart: 0</span>
    </nav>
  </header>

  <main>
    <section class="product"
             data-item-id="SKU_TP30"
             data-item-name="Trail Pack 30L"
             data-item-category="Backpacks"
             data-price="79.00">
      <div class="image">Trail Pack 30L</div>
      <div>
        <h1>Trail Pack 30L</h1>
        <p class="price">$79.00</p>
        <p>A lightweight daypack with a hydration sleeve and rain cover.</p>

        <label for="color">Color:</label><br>
        <select id="color">
          <option value="forest">Forest</option>
          <option value="slate">Slate</option>
          <option value="rust">Rust</option>
        </select><br>

        <button class="btn" id="add-to-cart" type="button">Add to Cart</button>
        <a href="thanks.html?checkout=1" class="btn btn-secondary" id="checkout-btn">Checkout</a>
        <p id="cart-message"></p>
      </div>
    </section>
  </main>

  <footer>Trailhead Supply is a fictional store for analytics practice.</footer>

  <script>
    var count = parseInt(localStorage.getItem('cartCount') || '0', 10);
    var countEl = document.getElementById('cart-count');
    countEl.textContent = 'Cart: ' + count;

    document.getElementById('add-to-cart').addEventListener('click', function () {
      count += 1;
      localStorage.setItem('cartCount', count);
      countEl.textContent = 'Cart: ' + count;
      var color = document.getElementById('color').value;
      document.getElementById('cart-message').textContent = 'Added Trail Pack 30L (' + color + ') to your cart.';
      // WEEK 3 to 4: add a dataLayer.push for add_to_cart here.
    });
  </script>
</body>
</html>
